<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse Widget · 潮痕</title>
  <style>
    :root {
      color-scheme: light;
      --review-canvas: #eef0e8;
      --background: #edf5e7;
      --surface: #f6faef;
      --ink: #172119;
      --secondary: #667064;
      --action: #1f5e34;
      --field: #8aa57d;
      --grass: #68b33f;
      --shadow: #273027;
      --widget-paper: #fbf7ea;
      --widget-sky-glow: #e6c979;
      --widget-water: #70ad91;
    }

    body.dark {
      color-scheme: dark;
      --review-canvas: #050b06;
      --background: #07120a;
      --surface: #0d1c10;
      --ink: #f0f5ec;
      --secondary: #a6b0a2;
      --action: #276d3d;
      --field: #73966d;
      --grass: #91d55b;
      --shadow: #000;
      --widget-paper: #171a12;
      --widget-sky-glow: #d8b967;
      --widget-water: #5fa98c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--review-canvas);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", sans-serif;
    }

    main { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 42px 0 64px; }
    header { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 30px; }
    h1 { margin: 0 0 8px; font-size: clamp(32px, 5vw, 56px); letter-spacing: -.045em; }
    p { margin: 0; color: var(--secondary); line-height: 1.55; }

    .controls { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      border: 1px solid color-mix(in srgb, var(--ink) 16%, transparent);
      border-radius: 999px;
      padding: 10px 14px;
      color: var(--ink);
      background: var(--surface);
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; align-items: start; }
    .panel { padding: 22px; border-radius: 30px; background: color-mix(in srgb, var(--surface) 72%, transparent); }
    .panel h2 { margin: 0 0 16px; font-size: 14px; color: var(--secondary); letter-spacing: .08em; text-transform: uppercase; }

    .widget {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background:
        linear-gradient(145deg, color-mix(in srgb, var(--widget-paper) 52%, transparent), transparent 54%),
        var(--background);
      box-shadow: 0 18px 45px color-mix(in srgb, var(--shadow) 14%, transparent);
    }
    .widget.small { width: min(100%, 340px); aspect-ratio: 1; border-radius: 58px; margin: 0 auto; }
    .widget.medium { width: 100%; aspect-ratio: 2.08; border-radius: 58px; }
    body.checked .widget {
      background:
        radial-gradient(circle at 92% 12%, color-mix(in srgb, var(--widget-sky-glow) 11%, transparent), transparent 48%),
        linear-gradient(145deg, color-mix(in srgb, var(--widget-paper) 62%, transparent), color-mix(in srgb, var(--grass) 8%, transparent) 52%, color-mix(in srgb, var(--widget-water) 17%, transparent)),
        var(--background);
    }

    .copy { position: absolute; z-index: 3; left: 9%; top: 10%; max-width: 47%; }
    .date { color: var(--action); font-size: 13px; font-weight: 760; letter-spacing: .055em; }
    .habit { margin-top: 12px; color: var(--ink); font-size: clamp(17px, 2.5vw, 24px); font-weight: 720; line-height: 1.08; }
    .status { position: absolute; z-index: 3; left: 9%; bottom: 8%; color: var(--secondary); font-size: 12px; font-weight: 650; }

    .sky-glow {
      position: absolute;
      z-index: 0;
      width: 15%;
      aspect-ratio: 1;
      right: -5%;
      top: 10%;
      border-radius: 50%;
      background: color-mix(in srgb, var(--widget-sky-glow) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--widget-paper) 46%, transparent);
      box-shadow: 0 0 0 24px color-mix(in srgb, var(--widget-sky-glow) 4%, transparent);
    }

    .shore {
      position: absolute;
      z-index: 1;
      left: -2%;
      right: -2%;
      bottom: -1%;
      height: 40%;
      color: var(--field);
      transition: height 780ms cubic-bezier(.3,.05,.2,1);
    }
    body.checked .shore { height: 50%; color: var(--grass); }
    .shore svg { width: 100%; height: 100%; overflow: visible; }
    .water { fill: color-mix(in srgb, var(--widget-water) 58%, currentColor); opacity: .18; }
    .lip { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; opacity: .62; }
    .trace { fill: none; stroke: currentColor; stroke-width: 1; stroke-linecap: round; opacity: .22; }
    body.checked .water { opacity: .38; }
    body.checked .lip { opacity: .92; }
    body.checked .trace { opacity: .34; }
    body.checked .status { color: var(--action); }
    body.checked .sky-glow {
      background: color-mix(in srgb, var(--widget-sky-glow) 20%, transparent);
      box-shadow: 0 0 0 24px color-mix(in srgb, var(--widget-sky-glow) 7%, transparent);
    }

    .sun-reflection {
      position: absolute;
      z-index: 2;
      right: -1%;
      top: 50%;
      width: 16%;
      display: grid;
      justify-items: end;
      gap: 7px;
      opacity: .14;
    }
    .sun-reflection i {
      display: block;
      height: 2px;
      border-radius: 999px;
      background: var(--widget-sky-glow);
    }
    .sun-reflection i:nth-child(1) { width: 100%; }
    .sun-reflection i:nth-child(2) { width: 74%; }
    .sun-reflection i:nth-child(3) { width: 48%; }
    .sun-reflection i:nth-child(4) { width: 28%; }

    .mark {
      position: absolute;
      z-index: 4;
      width: 18%;
      aspect-ratio: 1;
      right: 8%;
      bottom: 24%;
      color: var(--field);
      transition: bottom 780ms cubic-bezier(.3,.05,.2,1), color 520ms ease;
    }
    body.checked .mark { bottom: 31%; color: var(--grass); }
    .mark::before {
      content: "";
      position: absolute;
      inset: 24%;
      border-radius: 50%;
      background: currentColor;
      opacity: .12;
    }
    .mark svg { width: 100%; height: 100%; transform: rotate(-18deg); transition: transform 520ms ease; }
    body.checked .mark svg { transform: rotate(0); }
    .ring { fill: none; stroke: currentColor; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 272 314; transition: stroke-dasharray 520ms ease; }
    body.checked .ring { stroke-dasharray: 314 314; }

    .small .copy { max-width: 56%; }
    .small .status { bottom: 9%; }
    .small .sky-glow { width: 22%; right: -7%; top: 11%; }
    .small .mark { width: 25%; right: 17%; bottom: 23%; }
    body.checked .small .mark { bottom: 32%; }

    .notes { margin-top: 28px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .note { padding: 18px; border-radius: 20px; background: var(--surface); }
    .note strong { display: block; margin-bottom: 7px; }
    .note p { font-size: 14px; }

    @media (prefers-reduced-motion: reduce) {
      .shore, .mark, .mark svg, .ring { transition: none; }
    }
    @media (max-width: 760px) {
      header { align-items: start; flex-direction: column; }
      .grid, .notes { grid-template-columns: 1fr; }
      .widget.medium { border-radius: 42px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>潮痕</h1>
        <p>淡日轮从卡牌边缘进入，倒影落进潮面；签到事实仍只由潮位、岸线与今日刻度表达。</p>
      </div>
      <div class="controls">
        <button type="button" id="state">切换为已留下</button>
        <button type="button" id="appearance">切换深色</button>
      </div>
    </header>

    <section class="grid">
      <article class="panel">
        <h2>Small</h2>
        <div class="widget small">
          <div class="sky-glow" aria-hidden="true"></div>
          <div class="copy"><div class="date">08 / 14</div><div class="habit">每天走路</div></div>
          <div class="status">今天待留下</div>
          <div class="shore"><svg viewBox="0 0 340 100" preserveAspectRatio="none"><path class="water" d="M-8 38 C48 22 96 50 160 38 C220 26 278 52 348 34 L348 108 L-8 108 Z"/><path class="lip" d="M-8 38 C48 22 96 50 160 38 C220 26 278 52 348 34"/><path class="trace" d="M-8 50 C52 36 108 58 170 46 C230 34 286 60 348 44"/></svg><div class="sun-reflection" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div>
          <div class="mark"><svg viewBox="0 0 100 100"><circle class="ring" cx="50" cy="50" r="43"/></svg></div>
        </div>
      </article>

      <article class="panel">
        <h2>Medium</h2>
        <div class="widget medium">
          <div class="sky-glow" aria-hidden="true"></div>
          <div class="copy"><div class="date">08 / 14</div><div class="habit">每天走路</div></div>
          <div class="status">今天待留下</div>
          <div class="shore"><svg viewBox="0 0 340 100" preserveAspectRatio="none"><path class="water" d="M-8 38 C48 22 96 50 160 38 C220 26 278 52 348 34 L348 108 L-8 108 Z"/><path class="lip" d="M-8 38 C48 22 96 50 160 38 C220 26 278 52 348 34"/><path class="trace" d="M-8 50 C52 36 108 58 170 46 C230 34 286 60 348 44"/></svg><div class="sun-reflection" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div>
          <div class="mark"><svg viewBox="0 0 100 100"><circle class="ring" cx="50" cy="50" r="43"/></svg></div>
        </div>
      </article>
    </section>

    <section class="notes">
      <div class="note"><strong>待签到</strong><p>潮面较低，今日环保持明确开口；日期、承诺、状态先于装饰。</p></div>
      <div class="note"><strong>已签到</strong><p>潮面一次上移，今日环闭合。两者共同说明事实变化，不增加第二主角。</p></div>
      <div class="note"><strong>系统边界</strong><p>Reduce Motion 直接显示相同终态；真实刷新和过渡仍以真机 Widget host 为准。</p></div>
    </section>
  </main>
  <script>
    const stateButton = document.querySelector('#state');
    const appearanceButton = document.querySelector('#appearance');
    const statuses = document.querySelectorAll('.status');

    stateButton.addEventListener('click', () => {
      document.body.classList.toggle('checked');
      const checked = document.body.classList.contains('checked');
      stateButton.textContent = checked ? '切换为待签到' : '切换为已留下';
      statuses.forEach((status) => { status.textContent = checked ? '今天已留下' : '今天待留下'; });
    });

    appearanceButton.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      appearanceButton.textContent = document.body.classList.contains('dark') ? '切换浅色' : '切换深色';
    });
  </script>
</body>
</html>
